  <main class="stagewrap" id="stagewrap">
    <!-- TRAVIS. Three states (class on <body>):
         welcome       avatar, "travıs", the welcome bubble writing itself, the question field
         is-chatting   after the first question: the avatar slides aside, the chat beside it
         is-presenting a project is open: Travis in the side column, project on the stage -->
    <section class="travis" id="travis" aria-label="Travis, AI agent">
      <div class="presence">
        <button type="button" class="avatar-btn" id="avatar-btn" data-i18n-aria="talkLabel" aria-label="Talk to Travis">
          <img class="avatar" src="assets/img/travis-white.png" alt="" width="440" height="440">
        </button>
        <p class="travis-name"><span aria-hidden="true">Travıs</span><span class="visually-hidden">travis</span></p>
      </div>

      <div class="chat" id="chat">
        <div class="log" id="log" aria-live="polite" aria-relevant="additions"></div>
        <div class="chips" id="chips"></div>
        <form class="ask is-empty" id="ask" autocomplete="off">
          <label class="visually-hidden" for="ask-input" data-i18n="askLabel">Ask Travis a question</label>
          <textarea id="ask-input" name="q" rows="1" maxlength="6000" data-i18n-placeholder="askPlaceholder" placeholder="Ask Travis about Mike's work…"></textarea>
          <button type="submit" class="send" data-i18n-aria="send" aria-label="Send">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </form>
      </div>
    </section>

    <!-- STAGE: opens when Travis or the visitor picks a project -->
    <section class="stage" id="stage" aria-label="Project" hidden>
      <div class="stage-bar">
        <span class="muted" id="stage-crumb">WORK</span>
        <button type="button" class="close" id="stage-close" data-i18n="close">× CLOSE</button>
      </div>
      <article class="project" id="project"></article>
    </section>
  </main>
